async function renderAdminLinkTasks(app) {
  app.appendChild(adminTabs('admin_linktasks'));
  
  const div = document.createElement('div');
  app.appendChild(div);
  div.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>';
  
  // This page is create-only now — the list of created tasks lives on
  // the "รายการ Survey" page. We need users (to assign) and branches
  // (because Account lives on branches, not users — filtering AS by
  //  Account means "AS who covers >=1 branch in that account").
  let usersRes, branchesRes;
  try {
    [usersRes, branchesRes] = await Promise.all([
      api('admin_get_users', {token: state.token}),
      api('admin_get_branches', {token: state.token})
    ]);
  } catch (e) { div.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`; return; }
  
  if (!usersRes.ok) {
    if (usersRes.error && usersRes.error.indexOf('Session') !== -1) { logout(); return; }
    div.innerHTML = `<div class="alert alert-error">${escapeHtml(usersRes.error)}</div>`;
    return;
  }
  const asUsers = usersRes.users.filter(u => u.role === 'as' && u.status === 'active');
  const allBranches = branchesRes.ok ? branchesRes.branches : [];
  
  // Map: AS code (uppercase) → Set of accounts they cover
  const asAccounts = {};
  allBranches.forEach(b => {
    const code = String(b.assigned_as_code || '').trim().toUpperCase();
    const acct = String(b.account || '').trim();
    if (!code || !acct) return;
    if (!asAccounts[code]) asAccounts[code] = new Set();
    asAccounts[code].add(acct);
  });
  const accountList = [...new Set(allBranches.map(b => String(b.account || '').trim()))].filter(Boolean).sort();
  
  const selectedAS = new Set();
  
  div.innerHTML = `
    <div class="card">
      <h2>+ สร้าง Link Task ใหม่</h2>
      <div class="form-row">
        <label>หัวข้อ <span class="required">*</span></label>
        <input type="text" id="ltTitle" placeholder="เช่น แบบสอบถามความพึงพอใจพนักงาน Q3" />
      </div>
      <div class="form-row">
        <label>คำอธิบาย (ไม่บังคับ)</label>
        <textarea id="ltDesc" rows="2" placeholder="เช่น กรอกภายในสัปดาห์นี้ ใช้เวลา 5 นาที"></textarea>
      </div>
      <div class="form-row">
        <label>ลิงก์ (Google Form / Sheet ที่เปิดสาธารณะแล้ว) <span class="required">*</span></label>
        <input type="text" id="ltUrl" placeholder="https://forms.gle/..." />
        <div style="font-size: 12px; color: var(--text-soft); margin-top: 4px;">ต้องขึ้นต้นด้วย https:// — ทดสอบเปิดลิงก์เองก่อนเผยแพร่</div>
      </div>
      <div class="form-row">
        <label>กำหนดส่ง (deadline)</label>
        <input type="date" id="ltDeadline" />
      </div>
      <div class="form-row">
        <label>เลือก AS ที่ต้องทำ (<span id="ltAsCount">0</span> / ${asUsers.length} คน)</label>
        <div class="filter-row mb-12">
          <select id="ltAcctFilter"><option value="">ทุก Account</option>${accountList.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}</select>
          <input type="text" id="ltAsSearch" placeholder="ค้นหา AS..." />
        </div>
        <div class="gap-8 mb-12">
          <button type="button" class="btn btn-sm btn-secondary" id="ltSelAll">เลือกทั้งหมดที่กรอง</button>
          <button type="button" class="btn btn-sm btn-secondary" id="ltClear">ล้าง</button>
        </div>
        <div class="branch-picker" id="ltAsPicker" style="max-height: 220px;"></div>
      </div>
      <button class="btn btn-success btn-block" id="ltPublish">เผยแพร่ Link Task</button>
    </div>
  `;
  
  const renderAsPicker = () => {
    const q = div.querySelector('#ltAsSearch').value.toLowerCase();
    const acct = div.querySelector('#ltAcctFilter').value;
    const filtered = asUsers.filter(u => {
      const code = String(u.login_code).trim().toUpperCase();
      const covers = asAccounts[code];
      if (acct && !(covers && covers.has(acct))) return false;
      return !q || String(u.login_code).toLowerCase().includes(q) || String(u.name).toLowerCase().includes(q);
    });
    const picker = div.querySelector('#ltAsPicker');
    picker.innerHTML = filtered.map(u => {
      const code = String(u.login_code).trim().toUpperCase();
      const covers = asAccounts[code] ? [...asAccounts[code]].sort().join(', ') : 'ไม่มีสาขา';
      return `
        <label>
          <input type="checkbox" value="${escapeHtml(u.login_code)}" ${selectedAS.has(u.login_code) ? 'checked' : ''} />
          <span><strong>${escapeHtml(u.login_code)}</strong> · ${escapeHtml(u.name)} <span style="color: var(--text-soft); font-size: 12px;">· ${escapeHtml(covers)}</span></span>
        </label>
      `;
    }).join('') || '<div style="text-align:center; color: var(--text-soft); padding: 12px; font-size: 13px;">ไม่พบ AS ตาม filter นี้</div>';
    picker.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selectedAS.add(cb.value);
        else selectedAS.delete(cb.value);
        div.querySelector('#ltAsCount').textContent = selectedAS.size;
      };
    });
  };
  div.querySelector('#ltAsSearch').oninput = renderAsPicker;
  div.querySelector('#ltAcctFilter').onchange = renderAsPicker;
  div.querySelector('#ltSelAll').onclick = () => {
    div.querySelectorAll('#ltAsPicker input[type=checkbox]').forEach(cb => {
      if (!cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change')); }
    });
  };
  div.querySelector('#ltClear').onclick = () => {
    selectedAS.clear();
    div.querySelector('#ltAsCount').textContent = '0';
    renderAsPicker();
  };
  renderAsPicker();
  
  div.querySelector('#ltPublish').onclick = async () => {
    const title = div.querySelector('#ltTitle').value.trim();
    const description = div.querySelector('#ltDesc').value.trim();
    const linkUrl = div.querySelector('#ltUrl').value.trim();
    const deadline = div.querySelector('#ltDeadline').value;
    
    if (!title) { setMsg('error', 'กรุณากรอกหัวข้อ'); return; }
    if (!linkUrl) { setMsg('error', 'กรุณาวางลิงก์'); return; }
    if (!/^https:\/\/.+/.test(linkUrl)) { setMsg('error', 'ลิงก์ต้องขึ้นต้นด้วย https://'); return; }
    if (selectedAS.size === 0) { setMsg('error', 'กรุณาเลือก AS อย่างน้อย 1 คน'); return; }
    
    if (!confirm(`เผยแพร่ Link Task "${title}" ให้ ${selectedAS.size} คน?`)) return;
    
    setState({loading: true});
    try {
      const r = await api('admin_create_link_task', {
        token: state.token, title, description,
        link_url: linkUrl, deadline,
        assigned_as_codes: [...selectedAS]
      }, {usePost: true});
      setState({loading: false});
      if (r.ok) {
        setMsg('success', 'สร้างสำเร็จ — กด "Copy ข้อความแจ้งกลุ่ม LINE" เพื่อแจ้งทีม');
        setState({screen: 'admin_linktask_progress', data: {task_id: r.task_id}});
      }
      else setMsg('error', r.error);
    } catch (e) { setState({loading: false}); setMsg('error', e.message); }
  };
}

        </div>

        ${res.announcement.link_url ? `<a href="${escapeHtml(res.announcement.link_url)}" target="_blank" rel="noopener" style="color:#0891b2; font-size:13px;">🔗 ${escapeHtml(res.announcement.link_url)}</a>` : ''}
        <div class="progress-bar" style="margin-top:10px;"><div class="fill" style="width:${res.summary.percent}%"></div></div>
        
        <div class="gap-8 mt-12">
          <button class="btn btn-sm" id="annAnnounce" style="background:#06c755;">💬 Copy ข้อความแจ้งกลุ่ม LINE</button>
          <button class="btn btn-sm btn-secondary" id="annRefresh">🔄 รีเฟรช</button>
          ${pending.length > 0 ? `<button class="btn btn-sm btn-secondary" id="annCopyPending">📋 Copy คนที่ยังไม่รับทราบ (${pending.length})</button>` : ''}
          <button class="btn btn-sm btn-danger" id="annDelete">🗑️ ลบประกาศ</button>
        </div>
      </div>
      
      ${pending.length > 0 ? `
        <div class="card">
          <h3 style="margin-top:0;">ยังไม่รับทราบ (${pending.length})</h3>
          <table>
            <thead><tr><th>AS Code</th><th>ชื่อ</th><th>เบอร์</th></tr></thead>
            <tbody>${pending.map(r => `<tr><td>${escapeHtml(r.as_code)}</td><td>${escapeHtml(r.as_name || '-')}</td><td style="font-size:13px; color:var(--text-soft);">${escapeHtml(r.as_phone || '-')}</td></tr>`).join('')}</tbody>
          </table>
        </div>

      ${acked.length > 0 ? `
        <div class="card">
          <h3 style="margin-top:0;">รับทราบแล้ว (${acked.length})</h3>
          <table>
            <thead><tr><th>AS Code</th><th>ชื่อ</th><th>เวลารับทราบ</th></tr></thead>
            <tbody>${acked.map(r => `<tr><td>${escapeHtml(r.as_code)}</td><td>${escapeHtml(r.as_name || '-')}</td><td style="font-size:13px; color:var(--text-soft);">${r.acked_at ? formatDate(r.acked_at) : '-'}</td></tr>`).join('')}</tbody>
          </table>
        </div>

    content.querySelector('#annAnnounce').onclick = () => {
      let msg = '📢 ประกาศ\n\n"' + res.announcement.title + '"\n' + res.announcement.body;
      if (res.announcement.link_url) msg += '\n\n🔗 ' + res.announcement.link_url;
      msg += '\n\nดูในแอป SS Survey แล้วกดรับทราบด้วยครับ\n' + appUrl();
      copyText(msg, 'ข้อความแจ้งกลุ่ม — วางในกลุ่ม LINE ได้เลย');

    const cp = content.querySelector('#annCopyPending');

      if (!confirm('ลบประกาศนี้และการรับทราบทั้งหมด? กู้คืนไม่ได้')) return;

    </div>
    
    <div class="card">
      <h2>เพิ่ม User คนเดียว</h2>

        <input type="text" id="oneCode" placeholder="AS Code" style="text-transform: uppercase;" />
        <input type="text" id="oneName" placeholder="ชื่อ" />
      </div>
      <div class="form-row inline">

        <select id="oneRole"><option value="as">AS</option><option value="super_admin">Admin</option></select>

      <button class="btn btn-block" id="addOneBtn">เพิ่ม User</button>

      <p style="color: var(--text-soft); font-size: 13px;">

      </p>

BKK11, สมหญิง รักงาน, 0892223333"></textarea>

  div.querySelectorAll('.toggle-status').forEach(btn => {

      setState({loading: true});
      try {
        const r = await api('admin_set_user_status', {token: state.token, login_code: btn.dataset.code, status: newStatus});
        setState({loading: false});
        if (r.ok) { setMsg('success', r.message); setState({screen: 'admin_users'}); }
        else setMsg('error', r.error);
      } catch (e) { setState({loading: false}); setMsg('error', e.message); }
    };
  });
  
  // ---- Multi-select delete ----

    delBtn.style.display = n > 0 ? 'inline-flex' : 'none';
    if (selAll) selAll.checked = n > 0 && n === checks().length;
  };
  checks().forEach(c => { c.onchange = updateDelBar; });

    checks().forEach(c => { c.checked = selAll.checked; });

  delBtn.onclick = async () => {

// ============================================================
// PWA SETUP — make the app installable (Add to Home Screen)
// Manifest + service worker are generated in-page so there are
// no extra files to upload to GitHub. Single index.html only.
// ============================================================

(function setupPWA() {
  // Build manifest dynamically and inject as a Blob URL
  const manifest = {
    name: 'SS Survey System',
    short_name: 'SS Survey',
    description: 'ระบบสำรวจภาคสนามสำหรับ Area Supervisor',
    start_url: '.',
    scope: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#fafafa',
    theme_color: '#1e40af',
    lang: 'th',
    icons: [
      { src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  } catch (e) { /* manifest injection failed — app still works as normal web page */ }
  
  // Register the service worker (required for install prompt).
  // Must be a REAL file on the server — sw.js sits next to index.html.
  // (Blob-URL service workers don't work in production: wrong scope + media type.)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* SW optional — app still works as a normal web page without it,
           just won't be installable until sw.js is present */
      });
    });
  }
  
  // Optional: show a subtle "ติดตั้งแอป" hint when installable (Android/Chrome)
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showInstallHint();
  });
  
  function showInstallHint() {
    if (document.getElementById('pwaInstallBar')) return;
    const bar = document.createElement('div');
    bar.id = 'pwaInstallBar';
    bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1e40af;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:9999;font-size:14px;box-shadow:0 -2px 8px rgba(0,0,0,0.15);';
    bar.innerHTML = '<span>📲 ติดตั้งเป็นแอปบนหน้าจอได้</span><span><button id="pwaInstallBtn" style="background:#fff;color:#1e40af;border:none;border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer;margin-right:8px;">ติดตั้ง</button><button id="pwaDismissBtn" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px;">×</button></span>';
    document.body.appendChild(bar);
    document.getElementById('pwaInstallBtn').onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      bar.remove();
    };
    document.getElementById('pwaDismissBtn').onclick = () => bar.remove();
  }
})();
